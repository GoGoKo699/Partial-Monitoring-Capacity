name: Verify monitoring record
on:
  push:
    branches: [main, 'initialize/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Infrastructure checks
        run: python -m unittest discover -s tests -v
      - name: Verify original sources and all 23 monitoring groups
        run: python verify.py --output-dir verification-artifacts
      - name: Certify the exact product capacity with rational arithmetic
        run: python checks/certify_product_capacity.py --output verification-artifacts/product-capacity-certificate.json
      - name: Check no source changes
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
      - name: Retain raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          if-no-files-found: warn
          retention-days: 30
