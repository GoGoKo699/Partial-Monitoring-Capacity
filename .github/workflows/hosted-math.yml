name: Check hosted mathematics
on:
  pull_request:
    paths: ['**/*.md', 'verification/hosted/**', '.github/workflows/hosted-math.yml']
  push:
    branches: [main]
    paths: ['**/*.md', 'verification/hosted/**', '.github/workflows/hosted-math.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hosted-browser
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
      - name: Install browser and source compiler
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-dependencies" --no-audit --no-fund playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-dependencies/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare every scoped expression with pinned GitHub pages
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          page_args=()
          while IFS= read -r page || test -n "$page"; do
            case "$page" in ''|'#'*) continue ;; esac
            page_args+=(--page "$page")
          done < verification/hosted/pages.txt
          test "${#page_args[@]}" -gt 0
          contract_args=()
          if test -f verification/hosted/math-contract.json; then
            contract_args=(--contract verification/hosted/math-contract.json)
          fi
          NODE_PATH="$RUNNER_TEMP/hosted-dependencies/node_modules" node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --revision "$SOURCE_REVISION" --output "$RUNNER_TEMP/hosted-evidence" \
            --python python "${page_args[@]}" "${contract_args[@]}"
      - name: Check source remains unchanged
        if: always()
        shell: bash
        run: git diff --exit-code && git diff --cached --exit-code
      - name: Retain source, reports, HTML, and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-math-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-evidence/
          if-no-files-found: error
          retention-days: 30
